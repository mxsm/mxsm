    <path d="M333 243h118m58 0h118" stroke="#edbd68" stroke-width="1.4" opacity=".88"/>
    <path d="m480 239 7 4-7 4-7-4Z" fill="#ffd27b"/>
    <g font-family="Georgia,serif" font-size="67" font-weight="700">
