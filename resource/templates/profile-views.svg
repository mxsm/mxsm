<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2880" height="1920" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">Profile Views · $total</title>
  <desc id="description">$total profile views since July 30, 2023. Each drum shows one digit with its own Foshan lion dance pose.</desc>
  <defs>
    $poses
    <linearGradient id="red">
      <stop stop-color="#691829"/><stop offset=".15" stop-color="#d94329"/>
      <stop offset=".42" stop-color="#b42d20"/><stop offset=".8" stop-color="#a12423"/>
      <stop offset="1" stop-color="#571a2b"/>
    </linearGradient>
    <linearGradient id="gold">
      <stop stop-color="#b9792a"/><stop offset=".19" stop-color="#ffdb83"/>
      <stop offset=".42" stop-color="#fff0a9"/><stop offset=".7" stop-color="#efac52"/>
      <stop offset="1" stop-color="#be7628"/>
    </linearGradient>
    <g id="drum">
      <ellipse cy="89" rx="55" ry="6" fill="#361c23" opacity=".50"/>
      <path d="M-50 8Q-59 40-53 62L-46 83Q0 96 46 83L53 62Q59 40 50 8Z" fill="url(#red)" stroke="#69291c" stroke-width="2"/>
      <path d="M-48 17Q-52 39-49 58M48 17Q52 38 49 58" fill="none" stroke="#f79b4a" stroke-width="2" opacity=".75"/>
      <path d="M-47 77Q0 91 47 77L46 84Q0 98-46 84Z" fill="url(#gold)" stroke="#814022"/>
      <ellipse cy="8" rx="52" ry="9.5" fill="url(#gold)" stroke="#8a411c" stroke-width="1.6"/>
      <ellipse cy="6.2" rx="48.2" ry="6.1" fill="#f3c58b" stroke="#ffe4a2" stroke-width="1.3"/>
      <g fill="#ffd889" stroke="#864b2e" stroke-width=".65">
        <circle cx="-45" cy="16.8" r="2"/><circle cx="-31" cy="19.8" r="2"/>
        <circle cx="-16" cy="21.2" r="2"/><circle cy="22" r="2"/>
        <circle cx="16" cy="21.2" r="2"/><circle cx="31" cy="19.8" r="2"/><circle cx="45" cy="16.8" r="2"/>
      </g>
    </g>
  </defs>
  <g font-family="Segoe UI,Arial,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#fff1d0">
    <image width="960" height="640" xlink:href="$stage"/>
    <text x="480" y="222" font-size="74" font-weight="800" font-style="italic" letter-spacing="-2"
