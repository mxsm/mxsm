<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3456" height="1820" viewBox="0 0 1728 910" role="img" aria-labelledby="title description">
  <title id="title">$owner · Weekly and daily contributions</title>
  <desc id="description">$description</desc>
  <defs>
    <filter id="roof-light" x="-75%" y="-160%" width="250%" height="420%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="tower" x2=".12" y2="1">
      <stop stop-color="#93f4e8"/><stop offset=".12" stop-color="#1e879e"/>
      <stop offset=".6" stop-color="#14738d"/><stop offset="1" stop-color="#36d5bd"/>
    </linearGradient>
    <linearGradient id="peak" x2=".1" y2="1">
      <stop stop-color="#ffe39b"/><stop offset=".1" stop-color="#d39939"/>
      <stop offset=".38" stop-color="#216e7c"/><stop offset="1" stop-color="#2bbaa4"/>
    </linearGradient>
    <linearGradient id="lacquer">
      <stop stop-color="#6b0d19"/><stop offset=".16" stop-color="#b6161c"/>
      <stop offset=".38" stop-color="#fb4a2b"/><stop offset=".53" stop-color="#d22c23"/>
      <stop offset=".86" stop-color="#8e141c"/><stop offset="1" stop-color="#ca3226"/>
    </linearGradient>
    <linearGradient id="brass">
      <stop stop-color="#be6a22"/><stop offset=".2" stop-color="#ffd370"/>
      <stop offset=".44" stop-color="#fff2b2"/><stop offset=".65" stop-color="#e99836"/>
      <stop offset="1" stop-color="#ffcc66"/>
    </linearGradient>
    <pattern id="windows" patternUnits="userSpaceOnUse" width="11" height="14">
      <rect x="2" y="4" width="2.4" height="5" rx=".6" fill="#ffdf80"/>
      <rect x="7" y="4" width="1.5" height="4" fill="#b2fbef" opacity=".84"/>
    </pattern>
    <g id="blossom" fill="#fff0bd">
      <ellipse cy="-2" rx="1.5" ry="2.4"/><ellipse cy="-2" rx="1.5" ry="2.4" transform="rotate(72)"/>
      <ellipse cy="-2" rx="1.5" ry="2.4" transform="rotate(144)"/><ellipse cy="-2" rx="1.5" ry="2.4" transform="rotate(216)"/>
      <ellipse cy="-2" rx="1.5" ry="2.4" transform="rotate(288)"/><circle r="1.1" fill="#ea8239"/>
    </g>
    <pattern id="plum" patternUnits="userSpaceOnUse" width="48" height="68">
      <path d="M-2 65Q12 55 16 40T28 12m-12 29L9 27m12-3 15-7" fill="none" stroke="#f3bc72" stroke-width="1.3"/>
      <use xlink:href="#blossom" x="9" y="28"/><use xlink:href="#blossom" x="16" y="43"/>
      <use xlink:href="#blossom" x="29" y="11"/><use xlink:href="#blossom" x="35" y="18"/>
    </pattern>
    <g id="star"><path d="m0-18 5.7 11.5 12.7 1.9-9.2 9 2.2 12.6L0 11l-11.4 6 2.2-12.6-9.2-9 12.7-1.9z" fill="#ffcb4b" stroke="#ffdf88" stroke-width="1.5"/></g>
    <g id="fork" stroke="#ffcd58" stroke-width="4" fill="#102047">
      <path d="M-11-10v8q0 6 11 9v6M11-10v8Q11 4 0 7" fill="none"/>
      <circle cx="-11" cy="-13" r="4"/><circle cx="11" cy="-13" r="4"/><circle cy="17" r="4"/>
    </g>
  </defs>
  <image width="1728" height="910" xlink:href="$background"/>
  <g font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" fill="#fff1d6" font-weight="bold">
    <text x="118" y="82" font-size="76">$total<tspan fill="#ffd15a" font-size="55" font-style="italic"> contributions</tspan></text>
    <use xlink:href="#star" transform="translate(1214 47) scale(1.15)"/>
    <text x="1247" y="64" font-size="48">$stars</text>
    <use xlink:href="#fork" transform="translate(1463 46) scale(1.08)"/>
    <text x="1492" y="64" font-size="48">$forks</text>
    <text x="138" y="121" font-size="25">Weekly</text>
    $skyline
    <image x="150" y="364" width="390" height="390" xlink:href="$lion"/>
    <rect x="904" y="436" width="527" height="70" rx="32" fill="#071c44" fill-opacity=".96" stroke="#f4b743" stroke-width="3"/>
    <path d="M884 471h20m527 0h20" stroke="#ffcd66" stroke-width="3"/>
    <text x="1167" y="483" text-anchor="middle" font-size="38" font-style="italic">Daily · <tspan fill="#ffce52">$week_range</tspan></text>
    $poles
    <path d="M0 821h1728" stroke="#e7a34c" stroke-width="2"/>
    $footer
  </g>
</svg>
