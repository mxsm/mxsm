name: Update profile cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        id: checkout

      - name: Refresh languages on the first successful run of the month
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/update_profile.py languages
          git add -- resource/generated/languages.{json,svg}

      - name: Refresh weekly and daily contributions
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/update_profile.py contributions
          git add -- resource/generated/contributions.{json,svg}

      - name: Refresh the Foshan lion view counter
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python3 -B scripts/update_profile.py profile-views
          git add -- resource/generated/profile-views.{json,svg}

      - name: Publish successfully generated cards
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.ref_type == 'branch' }}
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update profile card snapshots"
          if ! git push origin "HEAD:$GITHUB_REF"; then
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF"
          fi
